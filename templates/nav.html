<header class="app-header sticky-top">
  <nav class="navbar modern-navbar">
    <div class="container-fluid app-toolbar">
      <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('dashboard') }}">
        <div class="brand-logo-ring"><i class="bi bi-heart-fill"></i></div>
        <div class="brand-text-group">
          <span class="brand-name">Our Little World</span>
          <span class="brand-tagline">Raj & Ashmita</span>
        </div>
      </a>

      <div class="app-toolbar-actions">
        <button class="app-back-button" id="appBackButton" type="button" data-fallback="{{ url_for('dashboard') }}" aria-label="Go back" title="Go back">
          <i class="bi bi-arrow-left"></i>
        </button>
        <button class="sidebar-toggle-btn" id="sidebarToggleBtn" type="button" aria-controls="appSidebar" aria-expanded="false" aria-label="Open navigation">
          <i class="bi bi-list"></i>
        </button>
      </div>
    </div>
  </nav>
</header>

<aside class="app-sidebar" id="appSidebar" aria-label="Main navigation">
  <div class="sidebar-heading">
    <span class="sidebar-section-label">Your space</span>
    <button class="sidebar-close-btn" id="sidebarCloseBtn" type="button" aria-label="Close navigation">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <nav class="sidebar-nav">
    <a class="sidebar-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}"><i class="bi bi-house-heart"></i><span>Home</span></a>
    <a class="sidebar-link {% if request.endpoint == 'gallery' %}active{% endif %}" href="{{ url_for('gallery') }}"><i class="bi bi-images"></i><span>Memories</span></a>
    <a class="sidebar-link {% if request.endpoint == 'messages' %}active{% endif %}" href="{{ url_for('messages') }}"><i class="bi bi-chat-heart"></i><span>Messages</span></a>
    <a class="sidebar-link {% if request.endpoint == 'music' %}active{% endif %}" href="{{ url_for('music') }}"><i class="bi bi-disc"></i><span>Music</span></a>
    <a class="sidebar-link {% if request.endpoint == 'mood' %}active{% endif %}" href="{{ url_for('mood') }}"><i class="bi bi-stars"></i><span>Mood</span></a>
    <a class="sidebar-link {% if request.endpoint == 'food' %}active{% endif %}" href="{{ url_for('food') }}"><i class="bi bi-cup-hot"></i><span>Food</span></a>
    <a class="sidebar-link {% if request.endpoint == 'mood_swings' %}active{% endif %}" href="{{ url_for('mood_swings') }}"><i class="bi bi-heart-pulse"></i><span>Mood Swings</span></a>
    <a class="sidebar-link {% if request.endpoint == 'location' %}active{% endif %}" href="{{ url_for('location') }}"><i class="bi bi-geo-alt"></i><span>Location</span></a>
    <button class="sidebar-link sidebar-preferences-toggle" id="sidebarPreferencesToggle" type="button" aria-expanded="true" aria-controls="sidebarPreferencesPanel">
      <i class="bi bi-sliders"></i><span>Preferences</span><i class="bi bi-chevron-down sidebar-preferences-chevron"></i>
    </button>
    <div class="sidebar-preferences-panel" id="sidebarPreferencesPanel">
      <div class="sidebar-preference-row">
        <span>Sound</span>
        <button class="btn btn-sm btn-nav-icon" id="loveAudioToggleBtn" type="button" aria-label="Toggle sound" title="Toggle sweet chimes">
          <i class="bi bi-volume-up-fill" id="loveAudioIcon"></i>
        </button>
      </div>
      <div class="sidebar-preference-row">
        <span>Petals</span>
        <button class="btn btn-sm btn-nav-icon" id="petalsToggleBtn" type="button" aria-label="Toggle petals" title="Toggle falling petals">
          <span id="petalsIcon">🌸</span>
        </button>
      </div>
    </div>
  </nav>

  <div class="sidebar-footer">
    {% if current_user %}
      <div class="user-capsule-badge sidebar-user" title="Logged in as {{ current_user.name }}">
        <span class="user-avatar-emoji">{% if current_user.name|lower == 'raj' %}🤴{% else %}👸{% endif %}</span>
        <span class="user-name-text">{{ current_user.name }}</span>
        <span class="user-status-dot" title="Active"></span>
      </div>
    {% endif %}
    <a href="{{ url_for('logout') }}" class="sidebar-logout"><i class="bi bi-box-arrow-right"></i><span>Log out</span></a>
  </div>
</aside>

<button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Close navigation"></button>
